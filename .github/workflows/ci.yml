name: ML Guardian CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install evidently==0.7.21

      - name: Run unit tests
        run: |
          python -m pytest tests/test_agents.py -v --tb=short --junitxml=test-results.xml

      - name: Generate test data
        run: |
          python -m pipelines.data_generator

      - name: Train model and verify metrics
        run: |
          python -c "
          from pipelines.train_initial_model import train_model
          result = train_model()
          metrics = result['metrics']
          
          # Fairness gate: minimum performance thresholds
          assert metrics['accuracy'] >= 0.80, f'Accuracy {metrics[\"accuracy\"]} below 0.80'
          assert metrics['f1_score'] >= 0.70, f'F1 {metrics[\"f1_score\"]} below 0.70'
          assert metrics['auc_roc'] >= 0.75, f'AUC-ROC {metrics[\"auc_roc\"]} below 0.75'
          print('All quality gates passed!')
          print(f'  Accuracy: {metrics[\"accuracy\"]}')
          print(f'  F1 Score: {metrics[\"f1_score\"]}')
          print(f'  AUC-ROC:  {metrics[\"auc_roc\"]}')
          "

      - name: Run drift simulation
        run: |
          python -m tests.simulate_drift

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            reports_output/
            audit_logs/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 --max-line-length=120 --ignore=E501,W503,E302,E303,E261,E262,W291,W292,W293,E741,E722,F841,E401,E711,F401,E266 agents/ core/ pipelines/ utils/

  docker:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ml-guardian:latest .
      - name: Test Docker image
        run: |
          docker run --rm ml-guardian:latest python -m pytest tests/test_agents.py -v --tb=short
